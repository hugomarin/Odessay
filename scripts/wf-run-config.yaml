agents:
  claude:
    cmd: claude
    cwd: repo_root
    mode: interactive_terminal
    prompt_pattern: "❯"
    startup_timeout_seconds: 30
    command_timeout_seconds: 1800

  codex:
    cmd: codex
    cwd: repo_root
    mode: interactive_terminal
    prompt_pattern: "❯"
    startup_timeout_seconds: 30
    command_timeout_seconds: 1800

build:
  agent: codex

review:
  agent: codex

loop:
  max_retries: 3
  max_close_retries: 2
  poll_interval_seconds: 30
  poll_timeout_seconds: 600

linear:
  status_in_progress: "In Progress"
  status_in_review: "In Review"
  status_done: "Done"
  approved_marker: "REVIEW APROBADO"
  rejected_marker: "REVIEW RECHAZADO"
