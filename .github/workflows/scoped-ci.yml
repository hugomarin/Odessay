name: Scoped CI

# Playwright E2E: herramienta especializada para UI choreography que
# realmente requiere browser, no el default para demostrar guardado de
# documentos, filesystem, identidad, export o sync (ver
# workflow/testing/critical-capabilities-testing.md). Por eso ya no forma
# parte de `CI required` (blocking-ci.yml no lo referencia). Se conserva como
# workflow reusable/manual: `workflow_dispatch` para invocarlo a demanda desde
# la UI/CLI de Actions, y `workflow_call` para una futura estrategia de CI
# scoped por área tocada (desktop/editor/perf/db vía changed-paths) — ese
# dispatch condicional no se construye en este cambio.

on:
  workflow_dispatch: {}
  workflow_call:

permissions:
  contents: read

jobs:
  desktop-draft-lifecycle:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: example-public-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Check desktop draft lifecycle
        run: npm run test:desktop:draft-lifecycle
