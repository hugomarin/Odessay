name: Traceability Gates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: example-public-anon-key
      ODESSAY_PERF_HARNESS_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # ODE-392/ODE-466: validate the synthetic merge result, not an
          # isolated PR head. The next step pins every SHA consumed later.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Pin immutable traceability refs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          MERGE_SHA="$(git rev-parse HEAD)"
          MERGE_BASE_SHA="$(git merge-base "${MERGE_SHA}" "${PR_BASE_SHA}")"
          PR_BRANCH_POINT_SHA="$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}")"
          # `grep -oE` exits 1 when the title has no ODE-XXX (e.g. a pure
          # docs/process PR) — under `set -e` that silently kills this step
          # with no visible error. `|| true` keeps ISSUE_IDS legitimately
          # empty instead of crashing the whole gate.
          ISSUE_IDS="$(printf '%s' "${PR_TITLE}" | grep -oE 'ODE-[0-9]+' | sort -u | paste -sd, - || true)"
          git cat-file -e "${PR_BASE_SHA}^{commit}"
          git cat-file -e "${PR_HEAD_SHA}^{commit}"
          git cat-file -e "${MERGE_SHA}^{commit}"
          test "${MERGE_BASE_SHA}" = "${PR_BASE_SHA}"

          {
            echo "TRACEABILITY_BASE_SHA=${PR_BASE_SHA}"
            echo "TRACEABILITY_MERGE_BASE_SHA=${MERGE_BASE_SHA}"
            echo "TRACEABILITY_PR_HEAD_SHA=${PR_HEAD_SHA}"
            echo "TRACEABILITY_HEAD_SHA=${MERGE_SHA}"
            echo "TRACEABILITY_MERGE_SHA=${MERGE_SHA}"
            echo "TRACEABILITY_PR_BRANCH_POINT_SHA=${PR_BRANCH_POINT_SHA}"
            echo "TRACEABILITY_ISSUE_IDS=${ISSUE_IDS}"
          } >> "${GITHUB_ENV}"

      - name: Diagnose traceability refs before build
        run: npm run ops:traceability:refs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check desktop draft lifecycle
        run: npm run test:desktop:draft-lifecycle

      - name: Build app for perf capture
        run: npm run build

      - name: Diagnose traceability refs after build
        run: npm run ops:traceability:refs

      - name: Check process docs sync
        run: npm run ops:process:sync

      # Los ledgers se unen solos vía `merge=union` (.gitattributes). Esa unión
      # es automática, así que CI tiene que verificar el resultado: JSONL
      # parseable, sin marcadores de conflicto y con newline final.
      - name: Validate workflow ledgers
        run: npm run ops:workflow:validate

      - name: Check status drift
        run: npm run ops:status:drift:strict

      - name: Capture editor trace
        run: |
          set -euo pipefail

          npm run start -- --hostname 127.0.0.1 --port 4010 > /tmp/odessay-start.log 2>&1 &
          APP_SERVER_PID=$!

          cleanup() {
            kill "${APP_SERVER_PID}" || true
            wait "${APP_SERVER_PID}" 2>/dev/null || true
          }

          trap cleanup EXIT

          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4010/perf/editor-harness > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:4010/perf/editor-harness > /dev/null

          npm run ops:perf:capture -- --base-url http://127.0.0.1:4010 --output artifacts/perf/editor-ci-trace.json.gz

      - name: Check delivery gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPS_PERF_TRACE_PATH: artifacts/perf/editor-ci-trace.json.gz
          OPS_PERF_REPORT_PATH: artifacts/perf/editor-ci-report.json
          OPS_PERF_METRICS_PATH: artifacts/perf/editor-ci-metrics.json
        run: npm run ops:delivery:gate

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-perf-gate-${{ github.run_id }}
          path: artifacts/perf/
          if-no-files-found: warn
