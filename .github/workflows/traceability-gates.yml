name: Traceability Gates

on:
  pull_request:
    branches:
      - main

jobs:
  traceability:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: example-public-anon-key
      ODESSAY_PERF_HARNESS_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve performance contract
        id: perf_contract
        run: |
          set -euo pipefail

          PR_BODY="$(node -e 'const fs = require("node:fs"); const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")); process.stdout.write(event.pull_request?.body || "");')"

          if printf '%s' "$PR_BODY" | grep -Eiq 'Performance Contract:[[:space:]]*required\b'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s' "$PR_BODY" | grep -Eiq 'Performance Contract:[[:space:]]*not required\b'; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build app for perf capture
        if: steps.perf_contract.outputs.required == 'true'
        run: npm run build

      - name: Check process docs sync
        run: npm run ops:process:sync

      - name: Check status drift
        run: npm run ops:status:drift:strict

      - name: Capture editor trace
        if: steps.perf_contract.outputs.required == 'true'
        run: |
          set -euo pipefail

          npm run start -- --hostname 127.0.0.1 --port 4010 > /tmp/odessay-start.log 2>&1 &
          APP_SERVER_PID=$!

          cleanup() {
            kill "${APP_SERVER_PID}" || true
            wait "${APP_SERVER_PID}" 2>/dev/null || true
          }

          trap cleanup EXIT

          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4010/perf/editor-harness > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:4010/perf/editor-harness > /dev/null

          npm run ops:perf:capture -- --base-url http://127.0.0.1:4010 --output artifacts/perf/editor-ci-trace.json.gz

      - name: Check delivery gate (perf required)
        if: steps.perf_contract.outputs.required == 'true'
        env:
          OPS_PERF_TRACE_PATH: artifacts/perf/editor-ci-trace.json.gz
          OPS_PERF_REPORT_PATH: artifacts/perf/editor-ci-report.json
          OPS_PERF_METRICS_PATH: artifacts/perf/editor-ci-metrics.json
        run: npm run ops:delivery:gate

      - name: Check delivery gate (perf not required)
        if: steps.perf_contract.outputs.required != 'true'
        run: npm run ops:delivery:gate

      - name: Upload perf artifacts
        if: always() && steps.perf_contract.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: editor-perf-gate-${{ github.run_id }}
          path: artifacts/perf/
          if-no-files-found: warn
