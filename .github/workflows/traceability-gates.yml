name: Traceability Gates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: example-public-anon-key
      ODESSAY_PERF_HARNESS_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Checking out a raw SHA (detached HEAD) does not create a local
      # origin/<base> ref even with fetch-depth: 0 — `git merge-base HEAD
      # origin/main` then fails with no common ancestor found, since
      # origin/main was never fetched. Fetch both PR refs explicitly and
      # fail fast here (a more diagnosable failure point than deep inside
      # ops:process:sync) rather than downstream.
      - name: Fetch PR refs
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" \
            "+refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
          git merge-base HEAD "origin/${GITHUB_BASE_REF}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check desktop draft lifecycle
        run: npm run test:desktop:draft-lifecycle

      - name: Build app for perf capture
        run: npm run build

      - name: Check process docs sync
        run: npm run ops:process:sync

      # Los ledgers se unen solos vía `merge=union` (.gitattributes). Esa unión
      # es automática, así que CI tiene que verificar el resultado: JSONL
      # parseable, sin marcadores de conflicto y con newline final.
      - name: Validate workflow ledgers
        run: npm run ops:workflow:validate

      - name: Check status drift
        run: npm run ops:status:drift:strict

      - name: Capture editor trace
        run: |
          set -euo pipefail

          npm run start -- --hostname 127.0.0.1 --port 4010 > /tmp/odessay-start.log 2>&1 &
          APP_SERVER_PID=$!

          cleanup() {
            kill "${APP_SERVER_PID}" || true
            wait "${APP_SERVER_PID}" 2>/dev/null || true
          }

          trap cleanup EXIT

          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:4010/perf/editor-harness > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:4010/perf/editor-harness > /dev/null

          npm run ops:perf:capture -- --base-url http://127.0.0.1:4010 --output artifacts/perf/editor-ci-trace.json.gz

      - name: Check delivery gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPS_PERF_TRACE_PATH: artifacts/perf/editor-ci-trace.json.gz
          OPS_PERF_REPORT_PATH: artifacts/perf/editor-ci-report.json
          OPS_PERF_METRICS_PATH: artifacts/perf/editor-ci-metrics.json
        run: npm run ops:delivery:gate

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-perf-gate-${{ github.run_id }}
          path: artifacts/perf/
          if-no-files-found: warn
