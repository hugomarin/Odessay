# Architecture ratchets — ver Odyssey Quality Harness spec §7.6 y
# tests/architecture/persistence-boundary.test.ts, que aplica este archivo.
#
# El baseline debe ser exactamente el conjunto de violaciones actuales
# toleradas — nunca un techo laxo. El ratchet es monotónico en ambas
# direcciones:
#   - violación actual no listada en el baseline -> FAIL (violación nueva)
#   - violación actual listada en el baseline    -> PASS (deuda conocida)
#   - entrada de baseline que ya no viola         -> FAIL (removerla del
#     baseline; si se deja, la deuda puede reaparecer ahí sin que CI la note)

boundaries:
  ui-no-direct-persistence:
    description: >
      Componentes de UI/composición no llaman localDB.correctionBlocks
      directamente cuando existe un owner canónico de esa persistencia.
      Ver components/editor/AGENTS.md — deuda conocida documentada.
    from:
      - components
      - hooks
    forbidPattern: "localDB.correctionBlocks"
    canonicalOwner: lib/corrections/persistence.ts
