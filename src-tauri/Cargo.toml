[package]
name = "odessay"
version = "0.1.0"
description = "Odessay — A sanctuary for epistolary writing"
authors = ["Odessay"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "odessay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
rusqlite = { version = "0.40.0", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
