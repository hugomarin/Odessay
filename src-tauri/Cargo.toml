[package]
name = "odessay"
version = "0.3.5"
description = "Odessay — A sanctuary for epistolary writing"
authors = ["Odessay"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "odessay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
blake3 = "1"
rusqlite = { version = "0.40.0", features = ["bundled"] }
tauri-plugin-store = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
